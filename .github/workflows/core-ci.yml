name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore engine and smoke test
        run: dotnet restore Migrator.Application.Smoke/Migrator.Application.Smoke.csproj
      - name: Build engine and smoke test
        run: dotnet build Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release
      - name: Real installed Chromium + local HTTP NUnit browser smoke
        timeout-minutes: 15
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release -- --real-chromium-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-real-chromium-preview28-evidence
          path: artifacts/real-chromium-preview28/*
          if-no-files-found: warn
      - name: Observe synthetic NUnit 3 and NUnit 4 nested cleanup baseline
        run: python3 scripts/nunit_nested_source_probe.py
      - name: Run Core smoke
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release
      - name: Build dedicated project assembly CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: preview.29 real NUnit 3/4 discovery, TRX and explicit/failure comparison
        run: python3 scripts/nunit_execution_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview29-synthetic-nunit-evidence-linux
          path: artifacts/nunit-preview29/*
          if-no-files-found: warn
      - name: Generate, dotnet build and run complete synthetic NUnit target assembly
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release -- --project-assembly-only
      - name: Generate complete multi-project solution and verify independent NUnit assemblies
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release -- --multi-project-only
      - name: preview.30 real POM source/target NUnit and Chromium localhost E2E
        timeout-minutes: 18
        run: python3 scripts/p2_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview30-p2-pom-evidence-linux
          path: artifacts/pom-preview30/*
          if-no-files-found: warn
      - name: preview.31 structured POM source/target NUnit and Chromium localhost E2E
        timeout-minutes: 18
        run: python3 scripts/p2_structured_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview31-structured-pom-evidence-linux
          path: artifacts/pom-preview31/*
          if-no-files-found: warn
      - name: preview.32 typed POM helper and bounded retry real Chromium + NUnit TRX Linux
        timeout-minutes: 18
        run: python3 scripts/p2_typed_retry_source_target_chromium_runtime.py
      - name: preview.33 multi-argument ComboBox and detached Loader Chromium + NUnit TRX Linux
        timeout-minutes: 18
        run: python3 scripts/p2_preview33_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview33-pom-evidence-linux
          path: artifacts/pom-preview33/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview32-pom-evidence-linux
          path: artifacts/pom-preview32/*
          if-no-files-found: warn
      - name: Pack version-matched Core NuGet packages
        run: |
          mkdir -p artifacts/nuget
          for project in Migrator.Core Migrator.Roslyn Migrator.SeleniumCSharp Migrator.PlaywrightDotNet Migrator.Application; do
            dotnet pack "$project/$project.csproj" --no-restore -c Release -o artifacts/nuget
          done
      - name: Independent package consumer smoke
        run: |
          dotnet restore PackageConsumer.Smoke/PackageConsumer.Smoke.csproj --source "$PWD/artifacts/nuget" --source https://api.nuget.org/v3/index.json
          dotnet run --project PackageConsumer.Smoke/PackageConsumer.Smoke.csproj --no-restore -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: migrator-core-nuget-preview
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  windows-nunit-preview29:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core and synthetic smoke
        run: dotnet build Migrator.Application.Smoke/Migrator.Application.Smoke.csproj -c Release
      - name: Check static NUnit semantics without execution
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release
      - name: Build migration assembly CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real NUnit 3/4 source-target discovery and TRX on Windows
        run: python scripts/nunit_execution_runtime.py
      - name: preview.32 typed POM helper and bounded retry real Chromium + NUnit TRX Windows
        timeout-minutes: 18
        run: python scripts/p2_typed_retry_source_target_chromium_runtime.py
      - name: preview.33 multi-argument ComboBox and detached Loader Chromium + NUnit TRX Windows
        timeout-minutes: 18
        run: python scripts/p2_preview33_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview33-pom-evidence-windows
          path: artifacts/pom-preview33/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview32-pom-evidence-windows
          path: artifacts/pom-preview32/*
          if-no-files-found: warn
      - name: preview.31 structured POM source/target NUnit and Chromium on Windows
        timeout-minutes: 18
        run: python scripts/p2_structured_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview31-structured-pom-evidence-windows
          path: artifacts/pom-preview31/*
          if-no-files-found: warn
      - name: Real POM preview.30 synthetic Chromium and source/target NUnit TRX on Windows
        timeout-minutes: 18
        run: python scripts/p2_source_target_chromium_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview30-p2-pom-evidence-windows
          path: artifacts/pom-preview30/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrator-preview29-synthetic-nunit-evidence-windows
          path: artifacts/nunit-preview29/*
          if-no-files-found: warn

  p2-pom-ast-fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build P2 AST/Core smoke
        run: dotnet build Migrator.Application.Smoke/Migrator.Application.Smoke.csproj -c Release
      - name: Roslyn semantic source-backed POM action regression
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-action-only
      - name: preview.31 source-backed structured POM AST success/failure
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-structured-only
      - name: preview.32 typed POM helpers and bounded retry source AST
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-typed-retry-only
      - name: preview.33 cross-file POM helpers, conditions and negative AST
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview33-only
      - name: preview.35 immediate Count/Text NUnit assertion source AST
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview35-only
      - name: preview.36 source-backed rendered-text CSS/whitespace AST positives and blockers
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview36-only
      - name: preview.37 Unicode pre/pre-wrap rendered Text AST with fail-closed negatives
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview37-only
      - name: preview.38 typed NoSuchElement/Timeout catch and rethrow AST positive and negative
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview38-only
      - name: preview.39 external PageObject -> TestBase -> NUnit exception catch chain AST
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview39-only
      - name: preview.40 source-only external NUnit/TestBase catch contract AST positive and negative
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview40-only
      - name: preview.41 source-backed NUnit/TestBase async Count receiver AST and blockers
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview41-only
      - name: preview.42 typed constructor context/page and NUnit lifecycle AST positive and negative
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview42-only
      - name: preview.43 failure-atomic OneTimeSetUp/SetUp guarded cleanup and exception precedence AST
        run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-build -c Release -- --p2-preview43-only

  p2-preview34-real-selenium-vs-playwright:
    name: Preview.37 rendered Text Unicode Selenium + Playwright (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the exact same Chrome for Testing for both frameworks
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Build source-backed assembly CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real Selenium WebDriver vs Playwright .NET on same Chrome
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview37_rendered_text_unicode_real_chromium.py
      - name: Retain real browser TRX, DOM and failure screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview37-text-unicode-browser-${{ matrix.os }}
          path: artifacts/pom-preview37/*
          if-no-files-found: warn


  p2-preview38-exception-parity:
    name: Preview.38 actual Selenium vs Playwright exceptions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install same Chrome for Testing and matching ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Build source-attested Core CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real Selenium NoSuchElement/Timeout catch and rethrow against Playwright
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview38_source_exception_real_chromium.py
      - name: Retain real NUnit TRX, exceptions, browser DOM and PNG SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview38-real-exception-parity-${{ matrix.os }}
          path: artifacts/pom-preview38/*
          if-no-files-found: warn

  p2-preview39-external-exception-parity:
    name: Preview.39 real Selenium external catch counterexample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install same Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Compile source-only Core CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real Selenium outer catch versus unapproved Playwright inner draft
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview39_external_exception_real_chromium.py
      - name: Retain real TRX, DOM, exception, screenshots and source-hash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview39-real-external-catch-${{ matrix.os }}
          path: artifacts/pom-preview39/*
          if-no-files-found: warn

  p2-preview40-real-external-contract:
    name: Preview.40 source-attested external catch real Chrome (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install identical Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Build Core CLI and external contract AST
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real Selenium vs Playwright NUnit external source catch with negatives
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview40_external_contract_real_chromium.py
      - name: Retain real NUnit TRX, browser DOM, PNG, clause and source SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview40-external-contract-browser-${{ matrix.os }}
          path: artifacts/pom-preview40/*
          if-no-files-found: warn


  p1-preview41-real-async-count:
    name: Preview.41 actual Selenium vs Playwright async Count (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install same Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Compile source-backed Core CLI
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real Selenium vs generated reviewed async NUnit TestBase Count with negatives
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview41_async_count_real_chromium.py
      - name: Retain real NUnit TRX browser snapshots PNG and SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview41-async-count-browser-${{ matrix.os }}
          path: artifacts/pom-preview41/*
          if-no-files-found: warn


  p1-preview42-real-fixture-context:
    name: Preview.42 real NUnit IPage Context cleanup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact same Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Build Core CLI and lifecycle source inspection
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Actual Selenium versus Playwright NUnit injected Context/Page success and failure cleanup
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview42_fixture_lifecycle_real_chromium.py
      - name: Retain NUnit TRX, DOM, failure PNG, teardown and SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview42-fixture-context-browser-${{ matrix.os }}
          path: artifacts/pom-preview42/*
          if-no-files-found: warn


  p1-preview43-real-atomic-failure:
    name: Preview.43 real Chrome NUnit partial setup rollback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install matching Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Build Core CLI and source-typed lifecycle AST
        run: dotnet build Migrator.AssemblyCli/Migrator.AssemblyCli.csproj -c Release
      - name: Real NUnit partial Playwright setup failure and cleanup precedence
        timeout-minutes: 24
        env:
          MIGRATOR_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIGRATOR_CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
          MIGRATOR_CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          MIGRATOR_CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: python scripts/p2_preview43_failure_atomic_real_chromium.py
      - name: Retain Chrome fault matrix TRX, cleanup receipts and immutable source SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-preview43-failure-atomic-browser-${{ matrix.os }}
          path: artifacts/pom-preview43/*
          if-no-files-found: warn
